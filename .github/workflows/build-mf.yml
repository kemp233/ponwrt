name: Build XG-040G-MF Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mf-ubi-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build XG-040G-MF (UBI)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-mf-dl-${{ hashFiles('configs/an7583.config', 'configs/release.config', 'config/sfp-phylink.config') }}
          restore-keys: |
            ponwrt-mf-dl-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Remove failing miniupnpd patch
        run: |
          rm -f feeds/packages/net/miniupnpd/patches/020-descr-filter-fix.patch

      - name: Configure an7583 (XG-040G-MF UBI)
        run: |
          ./scripts/kconfig.pl + + \
            "configs/an7583.config" \
            "configs/release.config" \
            "config/sfp-phylink.config" > .config
          make defconfig

      - name: Set OMCC version
        run: |
          python3 scripts/set-omcc-version.py \
            feeds/pon_userspace/airoha-ponctl/files/pon.config \
            '0x86'
          grep -A4 "^config omci 'line0_omci'" \
            feeds/pon_userspace/airoha-ponctl/files/pon.config

      - name: Enable USB storage
        run: |
          sed -i \
            -e 's/^CONFIG_PACKAGE_kmod-usb-xhci-hcd=.*/CONFIG_PACKAGE_kmod-usb-xhci-hcd=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-usb3=.*/CONFIG_PACKAGE_kmod-usb3=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-usb-storage=.*/CONFIG_PACKAGE_kmod-usb-storage=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-usb-storage-uas=.*/CONFIG_PACKAGE_kmod-usb-storage-uas=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-fs-ext4=.*/CONFIG_PACKAGE_kmod-fs-ext4=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-fs-vfat=.*/CONFIG_PACKAGE_kmod-fs-vfat=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-fs-exfat=.*/CONFIG_PACKAGE_kmod-fs-exfat=y/' \
            -e 's/^CONFIG_PACKAGE_block-mount=.*/CONFIG_PACKAGE_block-mount=y/' \
            .config

      - name: Set EN8811H PHY reset timing
        run: |
          DTS=target/linux/airoha/dts/an7583-nokia_xg-040g-mf-common.dtsi
          sed -i -E "s|reset-assert-us = <[0-9]+>;|reset-assert-us = <10000>;|" "$DTS"
          grep -A3 "reset-gpios" "$DTS" | head -5

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Prepare kernel config
        run: |
          make kernel_oldconfig
          make target/linux/prepare -j"$(nproc)"

      - name: Build firmware
        run: |
          set +e
          make -j"$(nproc)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::group::Verbose rebuild of the failed package"
            make -j1 V=s package/feeds/packages/miniupnpd/compile \
              || make -j1 V=sc package/feeds/packages/miniupnpd/compile \
              || true
            echo "::endgroup::"
            exit "$rc"
          fi

      - name: Package firmware
        run: |
          test -d "bin/targets/airoha/an7583"
          mkdir -p release
          printf 'target=airoha/an7583\ndevice=nokia_xg-040g-mf-ubi\nomcc_version=0x86\ncommit=%s\n' \
            "$GITHUB_SHA" > release/BUILD-INFO.txt
          tar --zstd -cf "release/ponwrt-an7583-nokia_xg-040g-mf-ubi-omcc-0x86.tar.zst" \
            -C bin/targets/airoha an7583
          sha256sum "release/ponwrt-an7583-nokia_xg-040g-mf-ubi-omcc-0x86.tar.zst" \
            > "release/ponwrt-an7583-nokia_xg-040g-mf-ubi-omcc-0x86.tar.zst.sha256"

      - name: Collect offline packages
        run: |
          mkdir -p release/packages
          find bin/packages -type f \( -name 'luci*.apk' \
            -o -name 'rpcd*.apk' \
            -o -name 'uhttpd*.apk' \
            -o -name 'ucode*.apk' \
            -o -name 'libucode*.apk' \
            -o -name 'liblucihttp*.apk' \) \
            -exec cp -a {} release/packages/ \;
          ls -1 release/packages | head -20
          echo "total: $(ls -1 release/packages | wc -l) packages"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7583-nokia_xg-040g-mf-ubi
          path: release/*
          if-no-files-found: error
          retention-days: 14
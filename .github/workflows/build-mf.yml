name: Build XG-040G-MF Firmware

on:
  workflow_dispatch:
    inputs:
      usb_storage:
        description: Include USB storage packages (2.5G port)
        type: boolean
        default: true
      omcc_version:
        description: OMCC compatibility profile
        type: choice
        default: '0x86'
        options:
          - '0x86'
          - '0xb0'
        required: true
      disable_pon:
        description: "Disable the PON - test build to check the PON vs 2.5G SerDes conflict"
        type: boolean
        default: false
      en8811h_reset_us:
        description: "EN8811H reset-assert time in us - 10000 is upstream, 1000000 is the an7583 EVB"
        type: string
        default: '10000'
      enable_gsw_port1:
        description: "Bring up the 4th switch copper port (gsw_port1) as lan5"
        type: boolean
        default: false
      legacy_pcs:
        description: "Restore the pre-Sep-23 airoha PCS and phylink driver patches (bisect aid)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-mf-ubi-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build XG-040G-MF (UBI)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-mf-dl-${{ hashFiles('configs/an7583.config', 'configs/release.config') }}
          restore-keys: |
            ponwrt-mf-dl-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Remove failing miniupnpd patch
        run: |
          # upstream miniupnpd 2.3.11 already has the permission parser rewrite
          # patch 020-descr-filter-fix.patch conflicts and fails to apply
          rm -f feeds/packages/net/miniupnpd/patches/020-descr-filter-fix.patch

      - name: Configure an7583 (XG-040G-MF UBI)
        run: |
          ./scripts/kconfig.pl + \
            "configs/an7583.config" \
            configs/release.config > .config
          make defconfig

      - name: Set OMCC compatibility version
        run: |
          python3 scripts/set-omcc-version.py \
            feeds/pon_userspace/airoha-ponctl/files/pon.config \
            '${{ inputs.omcc_version }}'
          grep -A4 "^config omci 'line0_omci'" \
            feeds/pon_userspace/airoha-ponctl/files/pon.config

      - name: Enable USB storage for 2.5G port
        if: inputs.usb_storage
        run: |
          sed -i \
            -e 's/^CONFIG_PACKAGE_kmod-usb-xhci-hcd=.*/CONFIG_PACKAGE_kmod-usb-xhci-hcd=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-usb3=.*/CONFIG_PACKAGE_kmod-usb3=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-usb-storage=.*/CONFIG_PACKAGE_kmod-usb-storage=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-usb-storage-uas=.*/CONFIG_PACKAGE_kmod-usb-storage-uas=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-fs-ext4=.*/CONFIG_PACKAGE_kmod-fs-ext4=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-fs-vfat=.*/CONFIG_PACKAGE_kmod-fs-vfat=y/' \
            -e 's/^CONFIG_PACKAGE_kmod-fs-exfat=.*/CONFIG_PACKAGE_kmod-fs-exfat=y/' \
            -e 's/^CONFIG_PACKAGE_block-mount=.*/CONFIG_PACKAGE_block-mount=y/' \
            .config

      - name: Enable GSW port 1 (4th switch copper port)
        if: inputs.enable_gsw_port1
        run: |
          # The AN7583 switch has 4 copper ports (port@1..port@4) plus the
          # CPU port at port@6. The board DTS only enables port@2..port@4,
          # so port@1 stays dark. Bring it up as lan5 so every physical
          # copper jack can be identified on real hardware.
          cat >> target/linux/airoha/dts/an7583-nokia_xg-040g-mf-common.dtsi <<'EOF'

          &gsw_port1 {
          	status = "okay";

          	label = "lan5";
          };

          &gsw_phy1 {
          	status = "okay";

          	interrupts = <1>;

          	pinctrl-names = "gbe-led";
          	pinctrl-0 = <&gswp1_led0_pins>;
          };
          EOF
          sed -i 's/ucidef_set_interfaces_lan_wan "lan1 lan2 lan3 lan4" "pon0"/ucidef_set_interfaces_lan_wan "lan1 lan2 lan3 lan4 lan5" "pon0"/' \
            target/linux/airoha/an7583/base-files/etc/board.d/02_network
          grep -n "ucidef_set_interfaces_lan_wan" target/linux/airoha/an7583/base-files/etc/board.d/02_network

      - name: Restore legacy airoha PCS / phylink patches
        if: inputs.legacy_pcs
        run: |
          # The MF 2.5G port worked on 2026-08-08 (commit f65530c1ca) and
          # stopped working after the 2026-09-23 PCS/phylink driver rewrite
          # (commit 5026b8e039). Restore the previous driver revisions to
          # bisect the regression.
          git checkout 5026b8e039^ -- \
            target/linux/airoha/patches-6.18/310-09-net-pcs-airoha-add-PCS-driver-for-Airoha-AN7581-SoC.patch \
            target/linux/airoha/patches-6.18/310-10-net-airoha-add-phylink-support.patch
          git status --short target/linux/airoha/patches-6.18/

      - name: Set EN8811H PHY reset timing
        run: |
          # The AN7583 EVB reference holds the EN8811H in reset for 1s and waits
          # 100ms before probing. Upstream ponwrt uses 10ms/20ms. Make it
          # selectable so the timing can be A/B tested on real hardware.
          DTS=target/linux/airoha/dts/an7583-nokia_xg-040g-mf-common.dtsi
          sed -i -E "s|reset-assert-us = <[0-9]+>;|reset-assert-us = <${{ inputs.en8811h_reset_us }}>;|" "$DTS"
          grep -A3 "reset-gpios" "$DTS" | head -5

      - name: Disable PON (SerDes conflict test)
        if: inputs.disable_pon
        run: |
          # The PON (GDM2 + xpon_mac + pon_pcs) and the 2.5G copper port
          # (GDM3 + eth_pcs) share the AN7583 SerDes/SCU XSI routing.
          # Disable the PON to A/B test whether it breaks the 2.5G link.
          cat >> target/linux/airoha/dts/an7583-nokia_xg-040g-mf-common.dtsi <<'EOF'

          &xpon_mac {
          	status = "disabled";
          };

          &pon_pcs {
          	status = "disabled";
          };

          &gdm2 {
          	status = "disabled";
          };
          EOF
          echo "--- PON disabled ---"
          tail -20 target/linux/airoha/dts/an7583-nokia_xg-040g-mf-common.dtsi

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: |
          set +e
          make -j"$(nproc)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::group::Verbose rebuild of the failed package"
            make -j1 V=s package/feeds/packages/miniupnpd/compile \
              || make -j1 V=sc package/feeds/packages/miniupnpd/compile \
              || true
            echo "::endgroup::"
            exit "$rc"
          fi

      - name: Package firmware
        env:
          OMCC_VERSION: ${{ inputs.omcc_version }}
        run: |
          test -d "bin/targets/airoha/an7583"
          mkdir -p release
          printf 'target=airoha/an7583\ndevice=nokia_xg-040g-mf-ubi\nomcc_version=%s\ncommit=%s\n' \
            "$OMCC_VERSION" "$GITHUB_SHA" > release/BUILD-INFO.txt
          tar --zstd -cf "release/ponwrt-an7583-nokia_xg-040g-mf-ubi-omcc-${OMCC_VERSION}.tar.zst" \
            -C bin/targets/airoha an7583
          sha256sum "release/ponwrt-an7583-nokia_xg-040g-mf-ubi-omcc-${OMCC_VERSION}.tar.zst" \
            > "release/ponwrt-an7583-nokia_xg-040g-mf-ubi-omcc-${OMCC_VERSION}.tar.zst.sha256"

      - name: Collect offline packages
        run: |
          # LuCI + uhttpd ucode plugin as .apk, so the web UI can be
          # installed on an already-flashed box without reflashing.
          mkdir -p release/packages
          find bin/packages -type f \( -name 'luci*.apk' \
            -o -name 'rpcd*.apk' \
            -o -name 'uhttpd*.apk' \
            -o -name 'ucode*.apk' \
            -o -name 'libucode*.apk' \
            -o -name 'liblucihttp*.apk' \) \
            -exec cp -a {} release/packages/ \;
          ls -1 release/packages | head -20
          echo "total: $(ls -1 release/packages | wc -l) packages"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7583-nokia_xg-040g-mf-ubi
          path: release/*
          if-no-files-found: error
          retention-days: 14
